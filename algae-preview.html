<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>早期绿色丝状藻类 · 场景预览</title>
<style>body{margin:0;background:#103e59;color:#e0efea;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:24px;top:24px;width:270px;padding:20px;border:1px solid #85a89955;border-radius:14px;background:#061921dd;backdrop-filter:blur(14px)}h1{font-size:18px;margin:0 0 12px}p{line-height:1.6;color:#a9c5c8;font-size:12px}input{width:100%;accent-color:#a3bd5f}button,select{background:#173c47;color:#e3eddd;border:1px solid #65909466;border-radius:6px;padding:8px;margin:3px}button{cursor:pointer}output{color:#cee49b}body.clean aside{display:none}#error{color:#ffb8a9}</style></head>
<body><canvas id="ocean"></canvas><aside><h1>海洋第一次变绿</h1><p>岩石上的丝状藻与藻膜逐步生长。拖动画面环顾，滚轮前后移动。</p><label>生长程度 <output id="value">0.60</output><input id="growth" aria-label="藻类生长程度" type="range" min="0" max="1" step=".01" value=".6"></label><div id="stages"><button data-growth="0">原始海洋</button><button data-growth=".3">③ 多细胞</button><button data-growth=".6">④ 蠕虫</button><button data-growth="1">⑤ 生态丰富</button></div><p><select id="view" aria-label="观察机位"></select><button id="quality">画质：精细</button></p><p id="status">正在加载海床与藻类…</p><p id="error"></p></aside><script type="module" src="/src/algae-preview.js"></script></body></html>
